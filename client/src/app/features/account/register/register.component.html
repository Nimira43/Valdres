<div class="max-w-lg mx-auto mt-32 p-8 bg-white rounded border border-grey-4 shadow-md">
  <form
    [formGroup]="registerForm"
    (ngSubmit)="onSubmit()"
    class="flex flex-col gap-4"
  >
    <h1 class="text-3xl font-medium text-main-dark text-center mb-2">
      Register
    </h1>

    <app-text-input
      label="Firstname"
      formControlName="firstName" 
    />
    <app-text-input
      label="Lastname"
      formControlName="lastName" 
    />
    <app-text-input
      label="Email"
      formControlName="email" 
    />
    <app-text-input
      label="Password"
      formControlName="password"
      type="password" 
    />
      
    @if (validationErrors) {
      <div class="mb-3 p-4 bg-red-100 text-red-600">
        <ul class="list-none px-3">
          @for (error of validationErrors; track $index) {
            <li>{{error}}</li>
          }
        </ul>
      </div>
    }

    <button 
      [disabled]="registerForm.invalid"
      type="submit" 
      class="btn main-outline-btn w-full py-3 mt-2"
    >
      Register
    </button>
  </form>
</div>
