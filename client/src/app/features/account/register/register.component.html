<div class="max-w-lg mx-auto mt-32 p-8 bg-white rounded border border-grey-4 shadow-md">
  <form
    [formGroup]="registerForm"
    (ngSubmit)="onSubmit()"
    class="flex flex-col gap-4"
  >
    <h1 class="text-3xl font-medium text-main-dark text-center mb-2">
      Register
    </h1>

    <div class="flex flex-col gap-1">
      <label for="firstName" class="text-sm text-grey-1">
        Firstname
      </label>
      <input
        id="firstName"
        formControlName="firstName"
        type="text"
        autocomplete="given-name"
        class="w-full bg-white text-dark border-2 border-grey-4 hover:border-grey-2 focus:border-main-dark focus:outline-none px-4 py-3 rounded transition-colors duration-500 ease-in-out"
      />
    </div>
    <div class="flex flex-col gap-1">
      <label for="lastName" class="text-sm text-grey-1">
        Lastname
      </label>
      <input
        id="lastName"
        formControlName="lastName"
        type="text"
        autocomplete="family-name"
        class="w-full bg-white text-dark border-2 border-grey-4 hover:border-grey-2 focus:border-main-dark focus:outline-none px-4 py-3 rounded transition-colors duration-500 ease-in-out"
      />
    </div>
    
    <div class="flex flex-col gap-1">
      <label for="email" class="text-sm text-grey-1">
        Email address
      </label>
      <input
        id="email"
        formControlName="email"
        type="email"
        autocomplete="email"
        class="w-full bg-white text-dark border-2 border-grey-4 hover:border-grey-2 focus:border-main-dark focus:outline-none px-4 py-3 rounded transition-colors duration-500 ease-in-out"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label for="password" class="text-sm text-grey-1">
        Password
      </label>
      <input
        id="password"
        formControlName="password"
        type="password"
        autocomplete="new-password"
        class="w-full bg-white text-dark border-2 border-grey-4 hover:border-grey-2 focus:border-main-dark focus:outline-none px-4 py-3 rounded transition-colors duration-500 ease-in-out"
      />
    </div>

    @if (validationErrors) {
      <div class="mb-3 p-4 bg-red-100 text-red-600">
        <ul class="list-none px-3">
          @for (error of validationErrors; track $index) {
            <li>{{error}}</li>
          }
        </ul>
      </div>
    }

    <button type="submit" class="btn main-outline-btn w-full py-3 mt-2">
      Register
    </button>
  </form>
</div>

<div class="max-w-lg-mx-auto mt-3 p-2">
  <pre>Form values: {{registerForm.value | json}}</pre>
  <pre>Form status: {{registerForm.status}}</pre>
</div>
