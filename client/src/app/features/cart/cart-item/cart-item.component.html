<div class="rounded-lg border border-gray-200 bg-white p-4 shadow-sm mb-4">
  <div class="flex items-center justify-between gap-6">
    <a 
      routerLink="/shop/{{item().productId}}"
      class="shrink order-1"
    >
      <img 
        src="{{item().pictureUrl}}" 
        alt="product image"
        class="h-20 w-20"
      >
    </a>
    <div class="flex items-center justify-between order-3">
      <div class="flex items-center align-middle gap-3">
        <button class="btn main-outline-btn px-2 py-1">
          <mat-icon>remove</mat-icon>
        </button>
        <div className="text-xl mb-1">
          {{item().quantity}}
        </div>
        <button class="btn main-outline-btn px-2 py-1">
          <mat-icon>add</mat-icon>
        </button>
      </div>
      <div class="text-end order-4 w-32">
        <p className="price">
          {{ item().price | currency: 'GBP' }}
        </p>
      </div>
    </div>
    <div class="w-full flex-col items-start flex-1 space-y-4 order-2 max-w-md">
      <a 
        routerLink="/shop/{{item().productId}}"
        className="font-medium"
      >
        {{item().productName}}
      </a>
      <div class="flex items-center gap-4">
        <button class="btn main-outline-btn px-2 py-1">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>
  </div>
</div>
